<script>
(()=>{

 try{edits=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{edits={}}
 const root=document.getElementById('catalog');
 function list(card){let ul=card.querySelector('.specs ul');return ul?[...ul.querySelectorAll('li')].map(x=>x.textContent).join('\n'):''}
 function setList(card,text){const box=card.querySelector('.specs');box.innerHTML='<summary>Ver características</summary><ul></ul><p class="note">Características editables del catálogo.</p>';for(const row of text.split(/\n|;/).map(x=>x.trim()).filter(Boolean)){const li=document.createElement('li');li.textContent=row;box.querySelector('ul').append(li)}}

 function attach(){for(const card of root.querySelectorAll('.card')){const name=card.querySelector('.name');const cat=card.closest('.category').querySelector('h2').textContent;const original=name.textContent;const key=cat+'::'+original;card.dataset.productKey=key;card.dataset.displayName=original;const data=edits[key];if(data){if(data.name)name.textContent=data.name;if(typeof data.features==='string')setList(card,data.features);if(Object.prototype.hasOwnProperty.call(data,'photo'))setPhoto(card,data.photo)}const btn=document.createElement('button');btn.className='edit-ficha';btn.textContent='Editar ficha';btn.addEventListener('click',()=>{const current=edits[key]||{};const nextName=prompt('Nombre del equipo',current.name||name.textContent);if(nextName===null)return;const currentFeatures=typeof current.features==='string'?current.features:list(card);const nextFeatures=prompt('Características (una por línea)',currentFeatures);if(nextFeatures===null)return;const currentPhoto=Object.prototype.hasOwnProperty.call(current,'photo')?current.photo:(card.querySelector('.product-photo')?.src||'');const nextPhoto=prompt('URL directa de una foto del modelo exacto. Déjalo vacío para quitarla.',currentPhoto);if(nextPhoto===null)return;edits[key]={name:nextName.trim(),features:nextFeatures,photo:nextPhoto.trim()||null};localStorage.setItem(storeKey,JSON.stringify(edits));name.textContent=edits[key].name||original;setList(card,nextFeatures);setPhoto(card,edits[key].photo)});card.querySelector('.details').append(btn)}}

})();

 document.body.append(backdrop);
 function saveCart(){localStorage.setItem('feralclick-shop-cart-v1',JSON.stringify(cart));renderCart()}
 function renderCart(){const list=backdrop.querySelector('.cart-items');list.replaceChildren();let total=0;for(const [key,item] of Object.entries(cart)){total+=item.qty;const row=document.createElement('div');row.className='cart-row';const label=document.createElement('div');label.className='cart-row-name';label.textContent=item.name;const cat=document.createElement('span');cat.className='cart-row-cat';cat.textContent=item.category;label.append(cat);const controls=document.createElement('div');controls.className='qty-controls';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','Quitar una unidad');minus.onclick=()=>{item.qty--;if(item.qty<=0)delete cart[key];saveCart()};const qty=document.createElement('span');qty.textContent=String(item.qty);const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','Agregar una unidad');plus.onclick=()=>{item.qty++;saveCart()};controls.append(minus,qty,plus);row.append(label,controls);list.append(row)}toolbar.querySelector('#cart-count').textContent='('+total+')';if(!total){const empty=document.createElement('div');empty.className='empty-cart';empty.textContent='Aún no agregas productos.';list.append(empty)}const lines=Object.values(cart).map(i=>`${i.qty} x ${i.name} (${i.category})`);const msg='Hola, FerAlClick. Quiero consultar disponibilidad, precio y detalles de estos productos:\n'+(lines.length?lines.join('\n'):'(sin productos seleccionados)');backdrop.querySelector('.whatsapp-order').href='https://wa.me/?text='+encodeURIComponent(msg)}
 function openCart(){backdrop.classList.add('open')}function closeCart(){backdrop.classList.remove('open')}
 toolbar.querySelector('.cart-open').onclick=openCart;backdrop.querySelector('.cart-close').onclick=closeCart;backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeCart()});backdrop.querySelector('.clear-cart').onclick=()=>{cart={};saveCart()};
 const allCards=[];for(const section of sections){const category=section.querySelector('h2').textContent;const grid=section.querySelector('.grid');const count=document.createElement('span');count.className='category-count';count.textContent=`${grid.querySelectorAll('.card').length} productos`;section.querySelector('h2').append(count);for(const card of grid.querySelectorAll('.card')){const name=card.querySelector('.name').textContent;const key=category+'::'+name;const actions=document.createElement('div');actions.className='store-actions';const add=document.createElement('button');add.type='button';add.textContent='Añadir a consulta';add.addEventListener('click',()=>{const itemKey=card.dataset.productKey||key;if(!cart[itemKey])cart[itemKey]={name:card.querySelector('.name').textContent,category,qty:0};cart[itemKey].qty++;cart[itemKey].name=card.querySelector('.name').textContent;saveCart();add.textContent='Agregado ✓';setTimeout(()=>add.textContent='Añadir a consulta',1200)});const quick=document.createElement('button');quick.type='button';quick.className='quick-view';quick.textContent='Ver detalles';quick.onclick=()=>{const d=card.querySelector('.specs');d.open=!d.open;d.scrollIntoView({behavior:'smooth',block:'nearest'})};actions.append(add,quick);card.querySelector('.details').append(actions);allCards.push({card,section,category})}}
 const noResults=document.createElement('div');noResults.className='no-results';noResults.hidden=true;noResults.innerHTML='<strong>No encontramos ese producto</strong>Prueba con otra marca o modelo.';root.append(noResults);
 function filter(){const term=toolbar.querySelector('#product-search').value.trim().toLocaleLowerCase('es');let visible=0;for(const item of allCards){const matchesCat=activeCategory==='Todas'||item.category===activeCategory;const matchesText=!term||item.card.textContent.toLocaleLowerCase('es').includes(term);item.card.hidden=!(matchesCat&&matchesText);if(!item.card.hidden)visible++}for(const s of sections)s.hidden=!([...s.querySelectorAll('.card')].some(c=>!c.hidden));noResults.hidden=visible!==0}
 toolbar.querySelector('#product-search').addEventListener('input',filter);renderCart();
})();
</script></body></html>
