<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catálogo FerAlClick</title><style>
:root{--ink:#111827;--muted:#687386;--bg:#f3f6fb;--blue:#1737b8;--cyan:#21c7d9;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#101c45,#1737b8 60%,#21c7d9);color:white;padding:36px max(24px,calc((100vw - 1180px)/2)) 30px}header small{letter-spacing:.18em;font-weight:bold}h1{font-size:clamp(30px,5vw,54px);margin:10px 0 5px}header p{margin:0;opacity:.9}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.category{margin:0 0 36px}.category h2{font-size:22px;margin:0 0 14px;display:flex;align-items:center;gap:10px}.category h2:after{content:"";height:1px;background:#d7deeb;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #1725540a}.photo{height:155px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fff 0,#e9f1ff 65%,#dce9ff 100%);position:relative}.pending{color:#53627b;font-size:12px;text-align:center;padding:14px;border:1px dashed #9eabc1;border-radius:12px;background:#ffffffa8}.product-photo{width:100%;height:100%;object-fit:contain;padding:10px}.specs{margin-top:10px;font-size:12px}.specs summary{cursor:pointer;color:#1737b8;font-weight:bold}.specs ul{padding-left:18px;margin:8px 0}.device{width:65px;height:115px;border:4px solid #192947;border-radius:14px;background:linear-gradient(155deg,#536ff5,#15c6d6);box-shadow:8px 8px 0 #1c315220;position:relative}.device:before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#17213a;top:5px;left:calc(50% - 2px)}.device.tablet{width:108px;height:82px;border-radius:11px}.device.laptop{width:112px;height:75px;border-radius:8px 8px 3px 3px}.device.laptop:after{content:"";position:absolute;left:-9px;right:-9px;height:5px;bottom:-9px;background:#192947;border-radius:0 0 7px 7px}.device.scooter{width:105px;height:5px;border:0;border-radius:8px;background:#192947;box-shadow:none}.device.scooter:before{width:12px;height:12px;top:-8px;left:5px;background:transparent;border:3px solid #192947}.device.scooter:after{content:"";position:absolute;width:25px;height:50px;border:4px solid #192947;border-left:0;border-bottom:0;left:28px;top:-52px;border-radius:0 15px 0 0}.tag{position:absolute;top:10px;left:10px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#33466d;background:#ffffffc9;padding:4px 7px;border-radius:99px}.details{padding:13px 14px 14px}.name{font-weight:700;min-height:42px}.actions{display:flex;gap:7px;margin-top:10px}.actions a{font-size:11px;text-decoration:none;padding:7px 9px;border-radius:8px;font-weight:bold}.search{background:#1737b8;color:white}.images{background:#e7f7fa;color:#08778a}.note{color:var(--muted);font-size:12px;margin-top:3px}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
</style></head><body><header><small>FERALCLICK</small><h1>Catálogo FerAlClick</h1><p>Encuentra tu próximo equipo · Fotos de referencia por modelo</p></header><main class="wrap" id="catalog"></main><footer>Solo se muestra una foto cuando coincide con el modelo. En las demás fichas, la imagen queda pendiente de verificar.</footer><script>
const groups=[
["TABLETS","Tablet Galaxy Tab A11 WiFi 8/128 GB","Tablet Infinix Xpad 30E 4G 128","Tablet Kids Play 7\"","Tablet Krono Net Ejecutiva estuché","Tablet Krono Net Z2","Xiaomi pad 2 128/4 wifi","Tecno MEGAPAD","Honor Pad X7","Honor Pad X8b","TCL Lught 4/128","Corn Star kids","Leader Kids 6/32GB","Leader Kids Pro 6/32GB"],
["HONOR","Honor Play 10 64/3","Honor X8D","Honor play 20A 64/4"],
["INFINIX","Infinix Hot 70 256","Infinix Note 60 Note 256","Infinix Note 60 Pro 5G 8/256","Infinix Note Edge 5G 256/8","Infinix Smart 20 256/4","Infinix Smart 20 4/64 GB"],
["ITEL","Itel A100C 128 GB","Itel A100CS 128 GB","Itel A100CS 64 GB","Itel A200 64GB"],
["MOTOROLA","Moto G06 256GB","Moto G67 256GB","Moto EDGE 50 fusión 8/256GB","Moto G17 Power 4/256","Moto EDGE 60 fusión 8/128GB","Moto EDGE 60 Fusión 8/256GB","Moto EDGE 70 Fusión 8/256"],
["IPHONE NUEVOS","iPhone 15 128 GB","iPhone 16 128 GB","iPhone 17 pro Max 256","iPhone 18 Pro Max 256"],
["IPHONE USADOS","Iphone 11 128gb","Iphone 12 128gb","Iphone 12 promax 128gb","Iphone 12 promax 256gb","Iphone 13 pro 128gb","Iphone 13 pro 256 GB","iPhone 13 Pro Max 128 GB","Iphone 14 256gb","Iphone 14 128gb","Iphone 14 promax 128gb","Iphone 14 promax 256gb","Iphone 15 128gb","Iphone 16 128gb","Iphone 16 pro 256gb","Iphone 16 promax 256","Iphone 14 pro 128gb","Iphone 15 pro 128gb","Iphone 15 promax 256gb"],
["OPPO","Oppo A6C 128/4"],
["PORTÁTILES / CONSOLA","Portátil HP 14-AQ3502LA Intel Celeron"],
["SAMSUNG","Samsung A07 64/4","Samsung A07 128/4","Samsung A07 128/6","Samsung A17 128/4","Samsung A 27 256/8","Samsung A37 128/6","Samsung A37 256/8 5G","Samsung S25 Ultra 512 GB"],
["SCOOTERS","Scooter Elite Xiaomi","Scooter Honor Electric P10"],
["TECNO","Tecno go3 64gb","Tecno pova slim 5g 256/8","Tecno spark 50 4g 4/256gb","Tecno spark 50 5g 8/256"],
["VIVO","VIVO Y05"],
["POCO","POCO X8 245/8"],
["XIAOMI","REDMI 15 8/256","REDMI 15c 8/256gb","REDMI 17 4/128","Xiaomi redmi 17 4/256GB","REDMI 17 256/6gb","REDMI A7pro 64/4","REDMI note 17 128/4","REDMI note 17 128/6","REDMI note 17 256/6","REDMI Note 17 Pro 5G","REDMI Buds 6 play","REDMI Whatch 5 lite","REDMI Note 15 PRO+ 8/256"],
["ZTE","Zte A56 4/128","Zte A56 pro 4/128","Zte A35e 64/4","Zte nubia v80max 8/256gb","Zte nubia v80pro 8/256gb"],
["CORN","Corn 4G Power K Pro","Corn Flip K","Flecha Corn"]
];
function shape(cat){if(cat.includes("TABLET"))return "tablet";if(cat.includes("PORTÁTIL"))return "laptop";if(cat.includes("SCOOTER"))return "scooter";return ""}
const root=document.getElementById('catalog');for(const [cat,...names] of groups){const section=document.createElement('section');section.className='category';const h=document.createElement('h2');h.textContent=cat;section.appendChild(h);const grid=document.createElement('div');grid.className='grid';for(const name of names){const card=document.createElement('article');card.className='card';const q=encodeURIComponent(name+' FerAlClick');const photo=name.toLowerCase().includes("infinix xpad 30e")?"https://linkphonescenter.com/images/uploads/IMG_5767-1771504793-0.jpeg":null; const specs=[name.match(/\b\d+\s*\/\s*\d+\b/)?.[0]?"Memoria indicada: "+name.match(/\b\d+\s*\/\s*\d+\b/)[0]:null, name.match(/\b\d+\s*GB\b/i)?.[0]?"Almacenamiento indicado: "+name.match(/\b\d+\s*GB\b/i)[0]:null, /\b5G\b/i.test(name)?"Conectividad indicada: 5G":/\b4G\b/i.test(name)?"Conectividad indicada: 4G":null, /WiFi|wifi/i.test(name)?"Conectividad indicada: Wi-Fi":null].filter(Boolean); const info=specs.length?specs:["Categoría: "+cat,"Modelo: "+name]; card.innerHTML=`<div class="photo"><span class="tag">${cat}</span>${photo?`<img class="product-photo" src="${photo}" alt="Foto de referencia de ${name}" loading="lazy">`:`<div class="pending">Foto exacta pendiente de verificar</div>`}</div><div class="details"><div class="name"></div><div class="note">${photo?"Foto de referencia encontrada":"Sin foto · pendiente de coincidencia exacta"}</div><details class="specs"><summary>Ver características</summary><ul>${info.map(x=>`<li>${x}</li>`).join("")}</ul><p class="note">Datos tomados del nombre del producto; confirma la ficha técnica exacta.</p></details><div class="actions"><a class="search" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${q}">Buscar fotos</a><a class="images" target="_blank" rel="noopener" href="https://www.bing.com/images/search?q=${q}">Más imágenes</a></div></div>`;card.querySelector(".name").textContent=name;grid.appendChild(card)}section.appendChild(grid);root.appendChild(section)}
</script><style>
.adminbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dbe3ef;padding:10px 18px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 3px 12px #17255410}.adminbar button,.adminbar label{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:#1737b8;color:#fff;font-size:13px}.adminbar .secondary{background:#e7f7fa;color:#08778a}.adminbar .hint{font-size:12px;color:#687386}.edit-ficha{display:none;margin-top:8px;border:1px solid #d7deeb;background:#f3f6fb;color:#1737b8;border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:700}.editing .edit-ficha{display:inline-block}.photo img{max-width:100%}input[type=file]{display:none}
</style>
<nav class="adminbar"><button id="edit-toggle">Activar edición</button><button id="export-data" class="secondary">Exportar cambios</button><label for="import-data" class="secondary">Importar cambios</label><input type="file" id="import-data" accept="application/json"><span class="hint">Los cambios se guardan en este navegador. Exporta un respaldo para transferirlos.</span></nav>
<script>
(()=>{
 const storeKey='feralclick-catalog-edits-v1'; let edits={};
 try{edits=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{edits={}}
 const root=document.getElementById('catalog');
 function list(card){let ul=card.querySelector('.specs ul');return ul?[...ul.querySelectorAll('li')].map(x=>x.textContent).join('\n'):''}
 function setList(card,text){const box=card.querySelector('.specs');box.innerHTML='<summary>Ver características</summary><ul></ul><p class="note">Características editables del catálogo.</p>';for(const row of text.split(/\n|;/).map(x=>x.trim()).filter(Boolean)){const li=document.createElement('li');li.textContent=row;box.querySelector('ul').append(li)}}
 function setPhoto(card,url){const area=card.querySelector('.photo');const tag=area.querySelector('.tag');area.innerHTML='';area.append(tag);if(url){const img=document.createElement('img');img.className='product-photo';img.loading='lazy';img.src=url;img.alt='Foto del modelo '+(card.dataset.displayName||'');area.append(img)}else{const pending=document.createElement('div');pending.className='pending';pending.textContent='Foto exacta pendiente de verificar';area.append(pending)}card.querySelector('.note').textContent=url?'Foto añadida · verificar que corresponda al modelo':'Sin foto · pendiente de coincidencia exacta'}
 function attach(){for(const card of root.querySelectorAll('.card')){const name=card.querySelector('.name');const cat=card.closest('.category').querySelector('h2').textContent;const original=name.textContent;const key=cat+'::'+original;card.dataset.productKey=key;card.dataset.displayName=original;const data=edits[key];if(data){if(data.name)name.textContent=data.name;if(typeof data.features==='string')setList(card,data.features);if(Object.prototype.hasOwnProperty.call(data,'photo'))setPhoto(card,data.photo)}const btn=document.createElement('button');btn.className='edit-ficha';btn.textContent='Editar ficha';btn.addEventListener('click',()=>{const current=edits[key]||{};const nextName=prompt('Nombre del equipo',current.name||name.textContent);if(nextName===null)return;const currentFeatures=typeof current.features==='string'?current.features:list(card);const nextFeatures=prompt('Características (una por línea)',currentFeatures);if(nextFeatures===null)return;const currentPhoto=Object.prototype.hasOwnProperty.call(current,'photo')?current.photo:(card.querySelector('.product-photo')?.src||'');const nextPhoto=prompt('URL directa de una foto del modelo exacto. Déjalo vacío para quitarla.',currentPhoto);if(nextPhoto===null)return;edits[key]={name:nextName.trim(),features:nextFeatures,photo:nextPhoto.trim()||null};localStorage.setItem(storeKey,JSON.stringify(edits));name.textContent=edits[key].name||original;setList(card,nextFeatures);setPhoto(card,edits[key].photo)});card.querySelector('.details').append(btn)}}
 attach();
 document.getElementById('edit-toggle').addEventListener('click',e=>{const on=document.body.classList.toggle('editing');e.currentTarget.textContent=on?'Cerrar edición':'Activar edición'});
 document.getElementById('export-data').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(edits,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='feralclick-cambios.json';a.click();URL.revokeObjectURL(a.href)});
 document.getElementById('import-data').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error('Formato inválido');edits=incoming;localStorage.setItem(storeKey,JSON.stringify(edits));location.reload()}catch{alert('No se pudo importar. Selecciona un JSON exportado desde este catálogo.')}e.target.value=''});
})();
</script></body></html>
